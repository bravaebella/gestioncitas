<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#FBF3F1" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Brava e' Bella" />
    <link rel="icon" type="image/png" href="./favicon.png" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <title>Brava e' Bella Nail's Studio</title>
    <script>
      try {
        var t = (JSON.parse(localStorage.getItem('brava-db-v1') || '{}').ajustes || {}).tema || 'auto'
        var o = t === 'oscuro' || (t === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = o ? 'dark' : 'light'
        document.querySelector('meta[name="theme-color"]').setAttribute('content', o ? '#150a11' : '#fbf3f1')
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
